
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Sin Cuenta</title>
  <style>
    body {
      width: 260px;
      padding: 18px;
      background: #111827;
      color: white;
      font-family: Arial, sans-serif;

    }

    h2 {
      color: #36a8eb;
      margin-bottom: 8px;
    }

    p {
      color: #aebccc;
      font-size: 12px;
