
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Sin Cuenta - Player</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1120;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      max-width: 950px;
      margin: auto;
    }

    h1 {
      color: #36a8eb;
      text-align: center;
    }

    .input-area {
      display: flex;
      gap: 10px;
      margin: 30px 0 20px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 8px;
      background: #ed2433;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: black;
      border-radius: 12px;
      overflow: hidden;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }

    #message {
      color: #f2903a;
      text-align: center;
      margin-top: 15px;
    }

    @media(max-width: 550px) {
      .input-area {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <h1>YouTube Sin Cuenta</h1>

    <p>Pega el enlace del vídeo educativo:</p>

    <div class="input-area">
      <input
        id="videoUrl"
        type="url"
        placeholder="https://www.youtube.com/watch?v=..."
      >
      <button id="play">REPRODUCIR</button>
    </div>

    <div class="video" id="videoContainer">
      <iframe
        id="player"
        title="Reproductor de YouTube"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <p id="message">
      Introduce un enlace para comenzar.
    </p>

  </div>

  <script src="player.js"></script>
</body>
</html>
